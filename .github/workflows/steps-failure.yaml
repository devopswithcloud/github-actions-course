name: Step Failure Demo
on: 
  workflow_dispatch: 
jobs:
  first-job: # id , name 
    name: First Job
    runs-on: ubuntu-latest
    steps: 
    - name: Step 1 
      run: |
        sleep 10
        echo "Step 1 is succesfull"

    - name: Step 2 
      run: |
        echo "Intentionally Failing this step"
        exit 1 
    - name: Step 3
      run: 
        echo " This is Step 3"
    - name: Step 4
      run: 
        echo " This is Step 4"
  my-second-job:
    name: My Second Job
    runs-on: ubuntu-latest
    steps:
    - name: Step 1 - Say hello again
      run: |
        sleep 5
        echo "************** Hello again from Second Job ************"