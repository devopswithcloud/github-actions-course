name: 08-Pull-Request-Event 
on:
  pull_request:
    # This workflow runs when a Pull Request is created or updated.
    # By default, opened, synchronize, reopened
    # if we want actions to run when pr is closed, we need to explicilty specify types as closed. 
jobs:
  pr-validation:
    name: pr-validation-job
    runs-on: ubuntu-latest
    steps:
    - name: Print Pull Request Details
      run: |
        echo "Workflow triggered by Pull Request Event"
        echo "Event Name        : ${{ github.event_name}}"
        echo "Source Branch     : ${{ github.head_ref }}"
        echo "Target Branch     : ${{ github.base_ref }}"
        echo "Branch is         : ${{ github.head_ref }}"
        echo "Repository is     :${{ github.repository }}"
        echo "Triggered By      : ${{ github.actor }}"
        echo "Commit SHA        : ${{ github.sha }}"
        echo "Action            : ${{github.event.action}}"
    - name: Checkout Source Code 
      uses: actions/checkout@v4
    - name: list files
      run: ls -la
