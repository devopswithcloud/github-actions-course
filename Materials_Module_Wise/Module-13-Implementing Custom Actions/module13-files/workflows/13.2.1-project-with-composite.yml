name: i27Academy DevOps Dashboard - CI (v6 Composite Actions)

# ══════════════════════════════════════════════════════════════
# PROJECT MILESTONE v6 — After Module 13 (Custom Actions)
#
# What's new in v6:
#   ✅ Composite action for Java build (.github/actions/java-build)
#   ✅ Composite action for failure notification (.github/actions/notify-failure)
#   ✅ Repeated setup steps replaced with single uses: line
#   ✅ Java version controlled in one place
#   ✅ Build outputs (jar-path, test-result) from composite action
#
# Built on top of v5:
#   ✅ push trigger — main branch + paths filter
#   ✅ pull_request trigger
#   ✅ schedule — nightly at 2am UTC
#   ✅ workflow_dispatch
#   ✅ env: at workflow level
#   ✅ vars.* and secrets.*
#   ✅ $GITHUB_ENV for IMAGE_TAG
#   ✅ test job + build job with needs: test
#
# Composite actions required:
#   .github/actions/java-build/action.yml
#   .github/actions/notify-failure/action.yml
# ══════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

env:
  APP_NAME:   i27academy-devops-dashboard
  REGISTRY:   docker.io
  IMAGE_NAME: devopswithcloudhub/i27academy-devops-dashboard

jobs:

  # ── Job 1: Test ────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and test
        id: build                              # id needed to read outputs
        uses: ./.github/actions/java-build     # composite action
        with:
          java-version: '21'
          run-tests: 'true'

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          service-name: ${{ env.APP_NAME }}
          branch: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          actor: ${{ github.actor }}

  # ── Job 2: Build ───────────────────────────────────────────
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build JAR
        id: build
        uses: ./.github/actions/java-build
        with:
          java-version: '21'
          run-tests: 'false'              # tests already ran in test job

      - name: Generate image tag
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Print build info
        run: |
          echo "============================="
          echo "BUILD INFORMATION"
          echo "============================="
          echo "App Name    : $APP_NAME"
          echo "JAR Path    : ${{ steps.build.outputs.jar-path }}"
          echo "Test Result : ${{ steps.build.outputs.test-result }}"
          echo "Image Tag   : $IMAGE_TAG"
          echo "Deploy Env  : ${{ vars.DEPLOY_ENV }}"
          echo "============================="

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: ${{ steps.build.outputs.jar-path }}
          retention-days: 7

      - name: Job Summary
        run: |
          echo "## i27Academy DevOps Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| App | $APP_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | $IMAGE_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "| JAR | ${{ steps.build.outputs.jar-path }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Result | ${{ steps.build.outputs.test-result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Build Successful |" >> $GITHUB_STEP_SUMMARY
