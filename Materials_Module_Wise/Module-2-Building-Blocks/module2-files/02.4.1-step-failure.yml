name: Step Failure Demo

on:
  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1
        run: echo "Step 1 Successful"

      - name: Step 2 Fail Intentionally
        run: |
          echo "Failing this step intentionally"
          exit 1 

      - name: Step 3
        run: echo "This step will be skipped"