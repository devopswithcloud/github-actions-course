name: Build, Test and Push Docker Image

# ════════════════════════════════════════════════════════════
# Complete dev → staging → production promotion pipeline
# with approval gate on production
#
# Setup required:
#   Environments:
#     development  → no protection
#     staging      → no protection
#     production   → required reviewers: your GitHub username
#                    deployment branches: main only
#
#   Secrets:
#     DOCKERHUB_USERNAME
#     DOCKERHUB_TOKEN
# ════════════════════════════════════════════════════════════

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'

  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy
        type: string
        default: 'v1.0.0'


# ════════════════════════════════════════════════════════════
# Global Environment Variables
# ════════════════════════════════════════════════════════════
env:
  DOCKER_IMAGE_NAME: i27academy/devops-dashboard


jobs:

  # ── Build ───────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.tag.outputs.value }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Build application and run tests
      - name: Build and Test Application
        run: mvn clean package

      # Commit SHA used as Docker image tag
      - id: tag
        run: echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: devops-dashboard-jar
          path: target/devops-dashboard-1.0.0.jar
          retention-days: 7


  # ── Docker Build and Push ───────────────────────────────────
  docker-build-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.image-tag }} \
            .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}

      - name: Docker Image Details
        run: |
          echo "========================================"
          echo "Docker Image Successfully Pushed"
          echo "========================================"
          echo "Repository : ${{ env.DOCKER_IMAGE_NAME }}"
          echo "Tag        : ${{ needs.build.outputs.image-tag }}"
          echo "Full Image : ${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}"
          echo "========================================"


  # ── Deploy Dev (automatic) ──────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest

    needs: [ build, docker-build-push ]

    concurrency:
      group: deploy-development
      cancel-in-progress: false

    environment:
      name: development
      url: https://dev.i27academy.com

    steps:

      - name: Deploy to development
        run: |
          echo "============================="
          echo "DEPLOYING TO DEVELOPMENT"
          echo "============================="
          echo "Image     : ${{ env.DOCKER_IMAGE_NAME }}"
          echo "Image tag : ${{ needs.build.outputs.image-tag }}"
          echo "Version   : ${{ inputs.version || github.sha }}"
          echo "Deployed  : ✅"


  # ── Deploy Staging (automatic after dev) ────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    needs: [ build, deploy-dev ]

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    environment:
      name: staging
      url: https://staging.i27academy.com

    steps:

      - name: Deploy to staging
        run: |
          echo "============================="
          echo "DEPLOYING TO STAGING"
          echo "============================="
          echo "Image     : ${{ env.DOCKER_IMAGE_NAME }}"
          echo "Image tag : ${{ needs.build.outputs.image-tag }}"
          echo "Deployed  : ✅"


  # ── Deploy Production (APPROVAL REQUIRED) ───────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    needs: [ build, deploy-staging ]

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    environment:
      name: production
      url: https://i27academy.com

    steps:

      - name: Deploy to production
        run: |
          echo "============================="
          echo "PRODUCTION DEPLOYED ✅"
          echo "============================="
          echo "Image      : ${{ env.DOCKER_IMAGE_NAME }}"
          echo "Image tag  : ${{ needs.build.outputs.image-tag }}"
          echo "Approved by: ${{ github.actor }}"
          echo "============================="


  # ── Summary (always runs) ───────────────────────────────────
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest

    needs:
      [
        build,
        docker-build-push,
        deploy-dev,
        deploy-staging,
        deploy-production
      ]

    if: always()

    steps:

      - name: Write summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Development | ${{ needs.deploy-dev.result }} | https://dev.i27academy.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging | ${{ needs.deploy-staging.result }} | https://staging.i27academy.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Production | ${{ needs.deploy-production.result }} | https://i27academy.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Push | ${{ needs.docker-build-push.result }} | Docker Hub |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ needs.build.outputs.image-tag }} | — |" >> $GITHUB_STEP_SUMMARY