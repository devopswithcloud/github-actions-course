name: 12.1.2-Environment-Secrets

# ════════════════════════════════════════════════════════════
# Before running create these environment secrets:
#   Repo → Settings → Environments → staging → Add secret
#     STAGING_DB_URL = jdbc:postgresql://staging-server/db
#
#   Repo → Settings → Environments → production → Add secret
#     PROD_DB_URL = jdbc:postgresql://prod-server/db
# ════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

jobs:

  # This job CAN access staging secrets
  staging-deploy:
    name: Staging Deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Access staging environment secret
        run: |
          echo "============================="
          echo "STAGING ENVIRONMENT SECRETS"
          echo "============================="
          echo "STAGING_DB_URL is set : ${{ secrets.STAGING_DB_URL != '' }}"
          echo "PROD_DB_URL is set    : ${{ secrets.PROD_DB_URL != '' }}"
          echo "============================="
          echo "Staging secret ✅ — Production secret ❌ (different env)"

  # This job CANNOT access environment secrets
  no-environment:
    name: No Environment Job
    runs-on: ubuntu-latest
    steps:
      - name: Try to access environment secrets
        run: |
          echo "============================="
          echo "NO ENVIRONMENT DECLARED"
          echo "============================="
          echo "STAGING_DB_URL is set : ${{ secrets.STAGING_DB_URL != '' }}"
          echo "PROD_DB_URL is set    : ${{ secrets.PROD_DB_URL != '' }}"
          echo "============================="
          echo "Both are EMPTY — no environment: declared on this job"

# ════════════════════════════════════════════════════════════
# Environment secrets key rule:
#   environment: staging   → unlocks staging secrets only
#   environment: production → unlocks production secrets only
#   no environment:         → ALL environment secrets are EMPTY
#
# This is SILENTLY EMPTY — no error is thrown
# Common gotcha — always check environment: is declared
# ════════════════════════════════════════════════════════════
